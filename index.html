<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giro Lettere</title>
<meta name="theme-color" content="#4C4CA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giro Lettere">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* Layout: app da tasca a una colonna, mappa in alto nella scheda Mappa, barra in basso, fogli dal basso */
:root{
  --bg:#F5F5FA; --surface:#FFFFFF; --ink:#1D1F33; --muted:#5C5F78; --line:#E1E1EE;
  --accent:#4C4CA0; --accent-ink:#FFFFFF; --accent-soft:#ECECF8;
  --grey:#62657E; --grey-bg:#EDEDF4;
  --amber:#8A5A00; --amber-bg:#FFF2CC;
  --orange:#B23C0A; --orange-bg:#FFE7D6;
  --red:#B42318; --red-bg:#FDE3E1;
  --green:#1C6E3D; --green-bg:#DFF2E6;
  --purple:#5B3AA8; --purple-bg:#EDE6FB;
  --line-grey:#8A8DA6; --line-amber:#D99A00; --line-orange:#E0601C; --line-red:#D92D20; --line-green:#2E9A5A; --line-purple:#7A55D6; --line-accent:#4C4CA0;
  --shadow:0 8px 30px rgba(29,31,51,.18);
  --f-head:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13141F; --surface:#1D1F2E; --ink:#ECECF5; --muted:#A3A5BE; --line:#2F3145;
  --accent:#9A9AF0; --accent-ink:#13141F; --accent-soft:#2A2B47;
  --grey:#B1B3CA; --grey-bg:#2A2C3D; --amber:#F5C66B; --amber-bg:#3A3018;
  --orange:#FFA370; --orange-bg:#40261A; --red:#FF9A90; --red-bg:#41201F;
  --green:#7BD9A0; --green-bg:#1B3526; --purple:#C6B2FF; --purple-bg:#2E2647;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.date{color:var(--muted);font-size:14px}
.sec{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:12px 14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;min-height:60px}
.row:last-child{border-bottom:0}
.row:active{background:var(--accent-soft)}
.row.cur{background:var(--accent-soft)}
.row-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--grey-bg);color:var(--grey);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.c-grey{color:var(--grey);background:var(--grey-bg)} .c-amber{color:var(--amber);background:var(--amber-bg)}
.c-orange{color:var(--orange);background:var(--orange-bg)} .c-red{color:var(--red);background:var(--red-bg)}
.c-green{color:var(--green);background:var(--green-bg)} .c-purple{color:var(--purple);background:var(--purple-bg)}
.c-accent{color:var(--accent);background:var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi b{font-family:var(--f-head);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-big{min-height:58px;font-size:17px;width:100%}
.btn-sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn-danger{color:var(--red);border-color:var(--red-bg)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px}
.alert{border:2px solid var(--orange);background:var(--orange-bg)}
.zona{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 2px 0}
.banner{border-radius:12px;padding:10px 14px;font-size:13.5px;background:var(--amber-bg);color:var(--amber);margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}
.status{padding:14px;display:flex;flex-direction:column;gap:12px}
.status-l{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:14px}
.pass{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:14px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.civ{min-height:54px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px 2px;font-variant-numeric:tabular-nums}
.civ small{font-size:10.5px;font-weight:600;opacity:.9;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.civ.c-grey,.civ.c-red,.civ.c-green,.civ.c-amber,.civ.c-purple,.civ.c-accent{border-color:transparent}
.legend{display:flex;gap:6px;flex-wrap:wrap}
/* mappa */
#mapbox{position:relative;margin:-14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 12px;}
#map{height:52vh;min-height:300px;background:var(--grey-bg)}
.maptools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.mapbtn svg{width:22px;height:22px}
.mapbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.maphint{pointer-events:none;position:absolute;left:12px;right:70px;top:12px;z-index:500;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.leaflet-container{font-family:var(--f-body)}
.stepnum{background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.stepnum.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:32px;height:32px;font-size:14px}
.vtx{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vtx.first{background:var(--green);width:20px;height:20px}
.me{width:18px;height:18px;border-radius:50%;background:#2F7BF6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,246,.25)}
.guide{padding:14px;display:flex;flex-direction:column;gap:10px}
.guide-t{font-family:var(--f-head);font-size:22px;font-weight:800;line-height:1.2}
.prog{height:8px;border-radius:999px;background:var(--grey-bg);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:58px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--orange);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{font-size:20px;font-weight:800}
.x{border:0;background:var(--grey-bg);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;flex:0 0 40px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.esiti{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.esiti button{min-height:56px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:15px;cursor:pointer}
.esiti button[aria-pressed="true"]{border-color:var(--ink)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 22px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.big{font-family:var(--f-head);font-weight:800;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:3000;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.small{font-size:13px;color:var(--muted)}
.danger-zone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.kpi b{font-size:20px}.f3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div id="mapbox" hidden>
    <div id="map" aria-label="Mappa"></div>
    <div class="maptools">
      <button class="mapbtn" id="btn-gps" data-act="gps" aria-pressed="false" aria-label="Mostra dove sono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="mapbtn" data-act="fit" aria-label="Inquadra il giro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="maphint" id="maphint" hidden></div>
  </div>
  <div id="app"><div class="empty">Carico…</div></div>
</div>
<nav class="tabs" aria-label="Sezioni"><div class="tabs-in" id="tabs"></div></nav>

<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
/* ================= utilità ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const oggi = () => isoOf(new Date());
const toUTC = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); };
const giorni = (a,b) => Math.round((toUTC(b)-toUTC(a))/86400000);
const addDays = (s,n) => { const t = new Date(toUTC(s)+n*86400000); return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate()); };
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmt = s => { if(!s) return ''; const [y,m,d] = s.split('-').map(Number); return d+' '+MESI[m-1]+(y!==new Date().getFullYear()?' '+y:''); };
const num = (n,d=0) => Number(n||0).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const prezzo = n => n==null||n==='' ? '–' : Number(n).toLocaleString('it-IT',{minimumFractionDigits:3,maximumFractionDigits:4});
const pct = (a,b) => b ? num(a/b*100,1)+'%' : '–';
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fasciaOra = () => { const d = new Date(), g = d.getDay(), h = d.getHours(); if(g===6) return 'sabato'; if(g===0) return 'domenica'; return h<13?'mattina':h<17?'pomeriggio':'sera'; };
const numVal = v => { if(v==null||v==='') return null; const n = Number(String(v).replace(',','.')); return isFinite(n) ? n : null; };
const km = m => m>=1000 ? num(m/1000,1)+' km' : num(Math.round(m/10)*10)+' m';
const normName = s => String(s||'').toLowerCase().replace(/ · tratto \d+$/,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();

/* ================= geometria ================= */
const R = 6371000, rad = x => x*Math.PI/180;
function hav(a,b){ const dLat = rad(b[0]-a[0]), dLon = rad(b[1]-a[1]); const s = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const lineLen = c => { let s=0; for(let i=1;i<c.length;i++) s+=hav(c[i-1],c[i]); return s; };
function inPoly(p, poly){ let ins=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [yi,xi]=poly[i],[yj,xj]=poly[j]; if(((yi>p[0])!==(yj>p[0])) && (p[1] < (xj-xi)*(p[0]-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function polyArea(poly){ if(poly.length<3) return 0; const lat0 = rad(poly[0][0]); const pts = poly.map(p=>[rad(p[1])*R*Math.cos(lat0), rad(p[0])*R]); let s=0; for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; s+=x1*y2-x2*y1; } return Math.abs(s/2); }
function densify(c, step=20){ const out=[c[0]]; for(let i=1;i<c.length;i++){ const a=c[i-1], b=c[i], d=hav(a,b), n=Math.floor(d/step); for(let k=1;k<=n;k++){ const t=k*step/d; if(t<1) out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); } out.push(b); } return out; }
function clipRuns(c, poly){ const runs=[]; let cur=[]; densify(c).forEach(p => { if(inPoly(p,poly)) cur.push(p); else { if(cur.length>1) runs.push(cur); cur=[]; } }); if(cur.length>1) runs.push(cur); return runs; }
function distPtSeg(p,a,b){ const k = Math.cos(rad(p[0])); const ax=(a[1]-p[1])*k, ay=a[0]-p[0], bx=(b[1]-p[1])*k, by=b[0]-p[0]; const dx=bx-ax, dy=by-ay; const L=dx*dx+dy*dy; let t = L ? -(ax*dx+ay*dy)/L : 0; t=Math.max(0,Math.min(1,t)); const x=ax+t*dx, y=ay+t*dy; return Math.sqrt(x*x+y*y)*111320; }
function distPtLine(p,c){ if(c.length===1) return hav(p,c[0]); let m=Infinity; for(let i=1;i<c.length;i++) m=Math.min(m,distPtSeg(p,c[i-1],c[i])); return m; }
const round5 = c => c.map(p=>[Math.round(p[0]*1e5)/1e5, Math.round(p[1]*1e5)/1e5]);
function thin(c, minD=12){ const out=[c[0]]; for(let i=1;i<c.length-1;i++) if(hav(out[out.length-1],c[i])>=minD) out.push(c[i]); out.push(c[c.length-1]); return out; }

/* ================= costanti ================= */
const TIPI = {villette:'Villette', condominio:'Condomini', misto:'Misto'};
const CANALI = {lettera:'Lettera', ripasso:'Ripasso porta a porta', segnalatore:'Segnalatore', passaparola:'Passaparola', altro:'Altro'};

const cmpCiv = (x,y) => (parseInt(x)||0)-(parseInt(y)||0) || String(x).localeCompare(String(y));
function civiciVia(v){
  const out=[]; const a=parseInt(v.dal), b=parseInt(v.al);
  if(a>0 && b>=a && b-a<=800){ for(let n=a;n<=b;n++){ if(v.lato==='pari'&&n%2) continue; if(v.lato==='dispari'&&!(n%2)) continue; out.push(String(n)); } }

}
const giroCorrente = v => (v.giri && v.giri.length) ? v.giri[v.giri.length-1] : null;

function statoCivico(v,id,c){

  const es = (v.segnati||[]).filter(s => s.civico===c).map(s=>s.esito);

const civiciAperti = (v,id) => civiciVia(v).filter(c => statoCivico(v,id,c)==='aperto');
function statoVia(v,id){
  const g = giroCorrente(v);

  const gg = giorni(g.data, oggi()); const p = (g.passaggi||[]).length;

  if(p===0){
    if(gg<7) return {k:'attesa', l:gg===0?'Lettera oggi':`Lettera da ${gg} gg`, c:'amber', ord:3, sub:`ripasso dal ${fmt(addDays(g.data,7))}`};
    if(gg<=14) return {k:'ripassa', l:'Da ripassare', c:'orange', ord:1, sub:`lettera da ${gg} giorni`};
    return {k:'ripassa', l:'Ripasso in ritardo', c:'red', ord:0, sub:`lettera da ${gg} giorni`};

function valutaOfferta(o){
  const gas = o.fornitura==='gas', imp = S.imp;
  const nostro = gas ? imp.nostroGas : imp.nostroLuce, rif = gas ? imp.psv : imp.pun, u = gas ? '€/Smc' : '€/kWh';
  if(o.rivisto && giorni(o.rivisto, oggi()) < 30) return {on:false, msg:`Ricontattato il ${fmt(o.rivisto)}: ricontrollo dal ${fmt(addDays(o.rivisto,30))}`};
  if(o.scadenza){ const d = giorni(oggi(), o.scadenza);
    if(d<=30) return {on:true, msg: d<0 ? `Offerta scaduta il ${fmt(o.scadenza)}` : d===0 ? 'Offerta in scadenza oggi' : `Scade tra ${d} giorni (${fmt(o.scadenza)})`}; }
  if(nostro==null) return {on:false, msg:`Imposta il nostro prezzo ${gas?'gas':'luce'} in Statistiche › Prezzi`};
  if(o.tipo==='variabile'){
    if(rif==null || o.spread==null) return {on:false, msg:`Serve ${gas?'il PSV':'il PUN'} del mese e lo spread`};
    const costo = Number(rif)+Number(o.spread);
    if(costo>nostro) return {on:true, msg:`Oggi paga circa ${prezzo(costo)} ${u}, il nostro è ${prezzo(nostro)}`};
    return {on:false, msg:`Oggi paga circa ${prezzo(costo)} ${u}: avviso quando supera ${prezzo(nostro)}`};
  }
  if(o.prezzo!=null && Number(o.prezzo)>nostro && !o.scadenza) return {on:true, msg:`Il suo fisso ${prezzo(o.prezzo)} è sopra il nostro ${prezzo(nostro)}`};
  return {on:false, msg: o.scadenza ? `Avviso 30 giorni prima della scadenza (${fmt(o.scadenza)})` : 'Aggiungi la data di scadenza per avere l’avviso'};
}
function avvisi(){ const out=[]; Object.entries(S.contatti).forEach(([id,k]) => (k.offerte||[]).forEach(o => { const r = valutaOfferta(o); if(r.on) out.push({id, k, o, msg:r.msg}); })); return out; }

const OVERPASS = ['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const HW_RE = '^(residential|living_street|unclassified|tertiary|secondary|primary|pedestrian|service|road)$';
async function overpass(q, label){
  const errs = [];
  for(const url of OVERPASS){
    const host = new URL(url).host;
    V.loadingMsg = `${label} · server ${errs.length+1} di ${OVERPASS.length}`; if(V.mode==='loading') render();
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 30000);
      const r = await fetch(url, {method:'POST', body:'data='+encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok){ errs.push(`${host}: risposta ${r.status}`); continue; }
      const j = await r.json();
      if(j && j.remark && /error|timed out|runtime|out of memory/i.test(j.remark)){ errs.push(`${host}: ${String(j.remark).slice(0,90)}`); continue; }
      if(!j || !Array.isArray(j.elements)){ errs.push(`${host}: risposta vuota`); continue; }
      return j;
    }catch(e){ errs.push(`${host}: ${e && e.name==='AbortError' ? 'troppo lento (30 s)' : (e && e.message) || 'errore di rete'}`); }
  }
  const err = new Error('overpass'); err.details = errs; throw err;
}
function bboxOf(poly){ const la = poly.map(p=>p[0]), lo = poly.map(p=>p[1]); return [Math.min(...la)-0.0004, Math.min(...lo)-0.0005, Math.max(...la)+0.0004, Math.max(...lo)+0.0005].map(x=>x.toFixed(6)).join(','); }
/* --- fonte 1: mappe vettoriali OpenFreeMap (veloci, dati OpenStreetMap) --- */
const OFM = 'https://tiles.openfreemap.org/planet';
async function fetchT(url, ms){ const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms); try{ return await fetch(url, {signal:ctl.signal}); } finally { clearTimeout(t); } }
function decodeMVT(buf){
  const b = new Uint8Array(buf); const td = new TextDecoder();
  function msg(start, end, onField){ let p = start;
    const varint = () => { let r = 0, m = 1, x; do{ x = b[p++]; r += (x & 0x7f) * m; m *= 128; } while(x & 0x80); return r; };
    while(p < end){ const key = varint(), f = Math.floor(key/8), wt = key % 8;
      if(wt===0) onField(f, 'v', varint());
      else if(wt===2){ const len = varint(); onField(f, 'b', p, p+len); p += len; }
      else if(wt===1){ onField(f, 'f64', new DataView(b.buffer, b.byteOffset+p, 8).getFloat64(0, true)); p += 8; }
      else if(wt===5){ onField(f, 'f32', new DataView(b.buffer, b.byteOffset+p, 4).getFloat32(0, true)); p += 4; }
      else throw new Error('pbf'); } }

    const L = {name:'', extent:4096, keys:[], values:[], feats:[]};
    msg(s, e, (f2, t2, s2, e2) => {
      if(f2===1) L.name = td.decode(b.subarray(s2, e2));
      else if(f2===5) L.extent = s2;
      else if(f2===3) L.keys.push(td.decode(b.subarray(s2, e2)));
      else if(f2===4){ let v = null; msg(s2, e2, (f3, t3, a3, b3) => { if(f3===1) v = td.decode(b.subarray(a3, b3)); else if(t3==='v') v = (f3===6) ? ((a3 % 2) ? -(a3+1)/2 : a3/2) : (f3===7 ? !!a3 : a3); else v = a3; }); L.values.push(v); }

function mvtLines(F){ const lines = []; let x = 0, y = 0, cur = null, i = 0; const g = F.geom; const zz = n => (n % 2) ? -(n+1)/2 : n/2;
  while(i < g.length){ const cmd = g[i] & 7, cnt = Math.floor(g[i] / 8); i++;
    if(cmd===7){ continue; }
    for(let k=0;k<cnt;k++){ x += zz(g[i++]); y += zz(g[i++]);
      if(cmd===1){ cur = [[x,y]]; lines.push(cur); } else if(cur) cur.push([x,y]); } }

const lon2t = (lon,z) => (lon+180)/360*2**z;
const lat2t = (lat,z) => (1-Math.log(Math.tan(rad(lat))+1/Math.cos(rad(lat)))/Math.PI)/2*2**z;
const t2ll = (tx,ty,z) => [Math.atan(Math.sinh(Math.PI*(1-2*ty/2**z)))*180/Math.PI, tx/2**z*360-180];
function clipTileLine(line, ext){ const runs = []; let cur = [];
  const ins = p => p[0]>=0 && p[0]<=ext && p[1]>=0 && p[1]<=ext;
  const pts = []; for(let i=0;i<line.length;i++){ if(i){ const a = line[i-1], c = line[i]; const d = Math.hypot(c[0]-a[0], c[1]-a[1]); const n = Math.floor(d/8); for(let k=1;k<n;k++) pts.push([a[0]+(c[0]-a[0])*k/n, a[1]+(c[1]-a[1])*k/n]); } pts.push(line[i]); }
  pts.forEach(p => { if(ins(p)) cur.push(p); else { if(cur.length>1) runs.push(cur); cur = []; } }); if(cur.length>1) runs.push(cur); return runs; }
const OFM_OK = ['primary','secondary','tertiary','minor','service','trunk'];
async function fetchTiles(poly){
  V.loadingMsg = 'Scarico la mappa della zona…'; if(V.mode==='loading') render();
  const tj = await (await fetchT(OFM, 15000)).json(); const tpl = tj.tiles && tj.tiles[0]; if(!tpl) throw new Error('tilejson');
  const z = 14; const la = poly.map(p=>p[0]), lo = poly.map(p=>p[1]);
  const x0 = Math.floor(lon2t(Math.min(...lo),z)), x1 = Math.floor(lon2t(Math.max(...lo),z)), y0 = Math.floor(lat2t(Math.max(...la),z)), y1 = Math.floor(lat2t(Math.min(...la),z));
  if((x1-x0+1)*(y1-y0+1) > 12) throw new Error('area troppo grande');
  const els = []; let nid_ = 1;
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
    const r = await fetchT(tpl.replace('{z}',z).replace('{x}',x).replace('{y}',y), 20000); if(!r.ok) throw new Error('tile '+r.status);
    const L = decodeMVT(await r.arrayBuffer());
    const tn = L.transportation_name, hn = L.housenumber;
    const props = (Lr, F) => { const o = {}; for(let i=0;i<F.tags.length;i+=2) o[Lr.keys[F.tags[i]]] = Lr.values[F.tags[i+1]]; return o; };
    if(tn) tn.feats.forEach(F => { if(F.type!==2) return; const pr = props(tn, F); const name = pr.name || pr['name:latin'] || pr['name:it']; if(!name) return;
      const cls = pr.class; if(!(OFM_OK.includes(cls) || (cls==='path' && pr.subclass==='pedestrian'))) return;
      mvtLines(F).forEach(l => clipTileLine(l, tn.extent).forEach(run => els.push({type:'way', id:'t'+(nid_++), tags:{highway: cls==='minor'?'residential':cls, name}, geometry: run.map(([px,py]) => { const [lat,lon] = t2ll(x+px/tn.extent, y+py/tn.extent, z); return {lat, lon}; })}))); });
    if(hn) hn.feats.forEach(F => { const pr = props(hn, F); if(!pr.housenumber) return;
      mvtLines(F).forEach(l => l.forEach(([px,py]) => { if(px<0||py<0||px>hn.extent||py>hn.extent) return; const [lat,lon] = t2ll(x+px/hn.extent, y+py/hn.extent, z); els.push({type:'node', id:'h'+(nid_++), lat, lon, tags:{'addr:housenumber': String(pr.housenumber)}}); })); });
  }

}
async function fetchOSM(poly){
  let errTiles = null;
  try{ const t = await fetchTiles(poly); if(t.elements.some(e=>e.type==='way')) return t; errTiles = 'nessuna via nella mappa'; }
  catch(e){ errTiles = (e && e.name==='AbortError') ? 'troppo lento' : (e && e.message) || 'errore'; }
  try{
    const bb = bboxOf(poly);
    const vie = await overpass(`[out:json][timeout:25];way["highway"~"${HW_RE}"]["name"](${bb});out geom;`, 'Cerco le vie');
    let addr = {elements:[]}; V.civiciErr = false;
    try{ addr = await overpass(`[out:json][timeout:25];(node["addr:housenumber"]["addr:street"](${bb});way["addr:housenumber"]["addr:street"](${bb}););out center;`, 'Cerco i civici'); }
    catch(e){ V.civiciErr = true; }
    const seen = new Set(); return {elements: vie.elements.concat(addr.elements).filter(e => { const k = e.type+e.id; if(seen.has(k)) return false; seen.add(k); return true; })};
  }catch(e){ const err = new Error('osm'); err.details = ['openfreemap: '+errTiles].concat((e && e.details) || []); throw err; }
}
function chainWays(lines){
  const near = (a,b) => hav(a,b) < 12;
  const rem = lines.map(l=>l.slice()); const chains=[];
  while(rem.length){
    let c = rem.shift(); let grown = true;
    while(grown){ grown=false;
      for(let i=0;i<rem.length;i++){ const l=rem[i]; const cs=c[0], ce=c[c.length-1], ls=l[0], le=l[l.length-1];
        if(near(ce,ls)) c=c.concat(l.slice(1)); else if(near(ce,le)) c=c.concat(l.slice().reverse().slice(1));
        else if(near(cs,le)) c=l.concat(c.slice(1)); else if(near(cs,ls)) c=l.slice().reverse().concat(c.slice(1)); else continue;
        rem.splice(i,1); grown=true; break; } }
    chains.push(c);
  }
  return chains;
}
function buildSegments(osm, poly){
  const els = (osm && osm.elements) || [];
  const byName = {};
  els.filter(e => e.type==='way' && e.tags && e.tags.highway && e.tags.name && e.geometry && !e.tags['addr:housenumber']).forEach(w => {
    const k = w.tags.name; (byName[k] = byName[k] || {lines:[], hw:new Set()}); byName[k].lines.push(w.geometry.map(g=>[g.lat,g.lon])); byName[k].hw.add(w.tags.highway); });
  const segs = [];
  Object.entries(byName).forEach(([name, o]) => {
    let pieces = []; chainWays(o.lines).forEach(c => clipRuns(c, poly).forEach(r => pieces.push(r)));
    pieces = pieces.map(p => ({c:p, len:lineLen(p)})).filter(p => p.len>=25).sort((a,b)=>b.len-a.len);
    const kept = [];
    pieces.forEach(p => { const probes = [p.c[0], p.c[Math.floor(p.c.length/2)], p.c[p.c.length-1]];
      if(kept.some(k => probes.every(q => distPtLine(q, k.c) < 35))) return; kept.push(p); });
    const main = [...o.hw].some(h => HW_MAIN.includes(h));
    kept.forEach((p,i) => segs.push({key:name+'#'+i, nome: name + (kept.length>1 ? ' · tratto '+(i+1) : ''), base:name, coords: round5(thin(p.c)), len:p.len, main, civici:[], sel:true}));
  });
  els.filter(e => e.tags && e.tags['addr:housenumber']).forEach(a => {
    const pt = a.type==='node' ? [a.lat,a.lon] : (a.center ? [a.center.lat,a.center.lon] : null); if(!pt || !inPoly(pt, poly)) return;
    const st = a.tags['addr:street'];
    const cand = st ? segs.filter(s => normName(s.base)===normName(st)) : segs; if(!cand.length) return;
    let best = cand[0], bd = Infinity; cand.forEach(s => { const d = distPtLine(pt, s.coords); if(d<bd){ bd=d; best=s; } });
    if(!st && bd > 40) return;
    String(a.tags['addr:housenumber']).split(/[;,]/).map(h=>h.trim()).filter(Boolean).forEach(h => { if(!best.civici.includes(h)) best.civici.push(h); });
  });
  segs.forEach(s => s.civici.sort(cmpCiv));
  return segs.sort((a,b)=>a.nome.localeCompare(b.nome,'it'));
}

/* ================= percorso più corto (approssimato) ================= */
function planRoute(segs, start){
  const n = segs.length; if(!n) return {tour:[], walk:0, tot:0};
  const A = i => segs[i].coords[0], B = i => segs[i].coords[segs[i].coords.length-1];
  const sp = (i,d) => d ? B(i) : A(i), ep = (i,d) => d ? A(i) : B(i);
  const cost = t => { let c = start ? hav(start, sp(t[0][0],t[0][1])) : 0; for(let k=0;k<t.length-1;k++) c += hav(ep(t[k][0],t[k][1]), sp(t[k+1][0],t[k+1][1])); return c; };
  let cur = start || A(0); const used = new Array(n).fill(false); let tour = [];
  for(let k=0;k<n;k++){ let bi=-1, bd=0, bx=Infinity;
    for(let i=0;i<n;i++){ if(used[i]) continue; for(const d of [0,1]){ const x = hav(cur, sp(i,d)); if(x<bx){ bx=x; bi=i; bd=d; } } }
    used[bi]=true; tour.push([bi,bd]); cur = ep(bi,bd); }
  let best = cost(tour), improved = true, it = 0;
  while(improved && it<40){ improved=false; it++;
    for(let i=0;i<n;i++) for(let j=i;j<n;j++){
      const t2 = tour.slice(0,i).concat(tour.slice(i,j+1).reverse().map(([s,d])=>[s,1-d]), tour.slice(j+1));
      const c = cost(t2); if(c < best-0.5){ tour=t2; best=c; improved=true; } }
    for(let i=0;i<n;i++){ const item = tour[i]; const rest = tour.slice(0,i).concat(tour.slice(i+1));
      for(let j=0;j<=rest.length;j++) for(const d of [0,1]){ if(j===i && d===item[1]) continue;
        const t2 = rest.slice(0,j).concat([[item[0],d]], rest.slice(j)); const c = cost(t2);
        if(c < best-0.5){ tour=t2; best=c; improved=true; } } }
  }
  const walk = tour.reduce((s,[i])=>s+segs[i].len,0);
  return {tour, walk, trans:best, tot:walk+best};
}

let map = null, layers = null, meMarker = null, mePos = null, watchId = null;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const lineColor = c => cssVar('--line-'+c) || '#4C4CA0';

  L.control.zoom({position:'bottomright'}).addTo(map);
  layers = L.layerGroup().addTo(map);
  map.on('click', e => { if(V.mode==='draw'){ V.draw.push([e.latlng.lat, e.latlng.lng]); drawMap(); render(); } });
  return true;
}
function stepIcon(n, cur){ return L.divIcon({className:'', html:`<div class="stepnum${cur?' cur':''}">${n}</div>`, iconSize: cur?[32,32]:[26,26], iconAnchor: cur?[16,16]:[13,13]}); }
function drawMap(){
  if(!map) return; layers.clearLayers();
  const accent = lineColor('accent');
  if(V.mode==='draw' || V.mode==='loading'){
    if(V.draw.length>1) L.polygon(V.draw, {color:accent, weight:3, fillOpacity:.12, dashArray: V.draw.length<3?'6 6':null}).addTo(layers);
    V.draw.forEach((p,i) => L.marker(p, {icon:L.divIcon({className:'', html:`<div class="vtx${i===0?' first':''}"></div>`, iconSize:[20,20], iconAnchor:[10,10]}), interactive:false}).addTo(layers));
    return;
  }
  if(V.mode==='review' && V.found){
    L.polygon(V.found.area, {color:accent, weight:2, fillOpacity:.06, dashArray:'6 6', interactive:false}).addTo(layers);
    const pv = V.preview;
    V.found.segs.forEach(s => L.polyline(s.coords, {color: s.sel ? accent : lineColor('grey'), weight: s.sel?5:3, opacity: s.sel?0.9:0.5}).addTo(layers));
    if(pv){ let prev = V.found.start;
      pv.order.forEach(([i,d],k) => { const s = V.found.segs[i]; const a = d ? s.coords[s.coords.length-1] : s.coords[0];
        if(prev) L.polyline([prev,a], {color:lineColor('grey'), weight:2, dashArray:'4 6', interactive:false}).addTo(layers);
        L.marker(a, {icon:stepIcon(k+1,false), interactive:false}).addTo(layers); prev = d ? s.coords[0] : s.coords[s.coords.length-1]; }); }
    return;
  }
  const p = V.pianoId && S.piani[V.pianoId];
  if(p){
    if(p.area) L.polygon(p.area, {color:accent, weight:2, fillOpacity:.04, dashArray:'6 6', interactive:false}).addTo(layers);
    let prev = null;
    p.ordine.forEach((st,k) => { const v = S.vie[st.viaId]; if(!v || !v.geom || v.geom.length<2) return;
      const s = statoVia(v, st.viaId); const cur = k===p.pos;
      const g = st.dir ? v.geom.slice().reverse() : v.geom;
      if(prev) L.polyline([prev, g[0]], {color:lineColor('grey'), weight:2, dashArray:'4 6', interactive:false}).addTo(layers);
      const pl = L.polyline(g, {color:lineColor(s.c), weight: cur?8:5, opacity: cur?1:0.85}).addTo(layers);
      pl.on('click', () => { if(V.mode==='idle'){ p.pos = k; putPiano(V.pianoId, p); drawMap(); } });
      L.marker(g[0], {icon:stepIcon(k+1,cur), zIndexOffset: cur?1000:0, interactive:false}).addTo(layers);
      prev = g[g.length-1]; });
    return;
  }
  Object.entries(S.vie).forEach(([id,v]) => { if(v.geom && v.geom.length>1) L.polyline(v.geom, {color:lineColor(statoVia(v,id).c), weight:5, opacity:.85}).on('click',()=>{ openVia(id); }).addTo(layers); });
}
function fitMap(){
  if(!map) return; const b = [];
  if(V.mode==='draw') V.draw.forEach(p=>b.push(p));
  else if(V.mode==='review' && V.found) V.found.segs.forEach(s=>s.coords.forEach(c=>b.push(c)));
  else if(V.pianoId && S.piani[V.pianoId]){ const p = S.piani[V.pianoId]; if(p.area) p.area.forEach(c=>b.push(c)); }
  else Object.values(S.vie).forEach(v => (v.geom||[]).forEach(c=>b.push(c)));
  if(b.length>1) map.fitBounds(b, {padding:[30,30], maxZoom:17}); else if(mePos) map.setView(mePos, 16);
}
function focusStep(){
  const p = V.pianoId && S.piani[V.pianoId]; if(!map || !p) return; const st = p.ordine[p.pos]; const v = st && S.vie[st.viaId];
  if(v && v.geom && v.geom.length) map.fitBounds(v.geom, {padding:[60,60], maxZoom:18});

function toggleGPS(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; if(meMarker){ meMarker.remove(); meMarker=null; } $('#btn-gps').setAttribute('aria-pressed','false'); return; }
  if(!navigator.geolocation){ toast('Questo telefono non dà la posizione.'); return; }
  $('#btn-gps').setAttribute('aria-pressed','true');
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    mePos = [pos.coords.latitude, pos.coords.longitude];
    if(!map) return;
    if(!meMarker) meMarker = L.marker(mePos, {icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[24,24], iconAnchor:[12,12]}), interactive:false, zIndexOffset:2000}).addTo(map);
    else meMarker.setLatLng(mePos);
    if(first){ map.setView(mePos, Math.max(map.getZoom(),16)); first=false; }
  }, err => { toast(err.code===1 ? 'Posizione negata: attivala nelle impostazioni del browser.' : 'Posizione non disponibile.'); $('#btn-gps').setAttribute('aria-pressed','false'); watchId=null; }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}

/* ================= statistiche ================= */
function calcola(){
  const vie = Object.entries(S.vie), cont = Object.values(S.contatti);
  const lettere = vie.reduce((s,[,v])=>s+lettereTot(v),0);
  const clienti = cont.filter(k=>k.luce||k.gas);
  const nLuce = cont.filter(k=>k.luce).length, nGas = cont.filter(k=>k.gas).length;
  const daLettera = cont.filter(k => k.viaId && (k.canale==='lettera'||k.canale==='ripasso'));
  const gruppi = keyOf => { const m = {};
    vie.forEach(([id,v]) => { const key = keyOf(v); m[key] = m[key] || {lettere:0, contatti:0, clienti:0}; m[key].lettere += lettereTot(v); });
    cont.forEach(k => { if(!k.viaId || !S.vie[k.viaId]) return; const key = keyOf(S.vie[k.viaId]); if(!m[key]) return; if(k.canale==='lettera'||k.canale==='ripasso') m[key].contatti++; if(k.luce||k.gas) m[key].clienti++; });
    return m; };
  const esiti = {}; let civTot = 0, civPassati = 0;
  vie.forEach(([id,v]) => { (v.segnati||[]).forEach(s => { esiti[s.esito] = (esiti[s.esito]||0)+1; });
    const g = giroCorrente(v); if(g && (g.passaggi||[]).length){ const cs = civiciVia(v); civTot += cs.length; civPassati += cs.filter(c=>statoCivico(v,id,c)!=='aperto').length; } });
  const canali = {}; cont.forEach(k => { const c = k.canale||'altro'; canali[c] = canali[c]||{contatti:0, clienti:0}; canali[c].contatti++; if(k.luce||k.gas) canali[c].clienti++; });
  const ks = vie.map(([id,v]) => statoVia(v,id).k);
  return { lettere, nVie:vie.length, vieFatte: ks.filter(k=>k==='fatta'||k==='rifare').length,
    vieRipassate: vie.filter(([,v]) => (v.giri||[]).some(g => (g.passaggi||[]).length)).length,
    contatti: cont.length, clienti: clienti.length, nLuce, nGas, lordo: nLuce*(S.imp.gettoneLuce||0)+nGas*(S.imp.gettoneGas||0),
    daLettera: daLettera.length, perTipo: gruppi(v=>v.tipo||'misto'), perZona: gruppi(v=>(v.zona||'Senza zona').trim()||'Senza zona'), esiti, civTot, civPassati, canali };
}
function progressoPiano(p){
  const vs = p.ordine.map(st => S.vie[st.viaId]).filter(Boolean);
  const lett = vs.filter(v => { const g = giroCorrente(v); return g && g.data >= p.creato; }).length;
  const rip = vs.filter(v => { const g = giroCorrente(v); return g && g.data >= p.creato && (g.passaggi||[]).length; }).length;
  return {tot:vs.length, lett, rip};
}

      :'<div class="card empty">Ancora nessun giro. Tocca “Nuova zona”, disegna l’area sulla mappa e l’app trova vie e percorso.</div>'}</div>`;
}
function viewGuida(pid, p){
  const tot = p.ordine.length; const pos = Math.min(p.pos||0, tot-1); const st = p.ordine[pos]; const v = st && S.vie[st.viaId];
  const pr = progressoPiano(p);
  if(!v) return `<div class="card empty">Le vie di questo giro sono state eliminate.</div><button class="btn" data-act="close-piano">Chiudi giro</button>`;
  const s = statoVia(v, st.viaId); const g = giroCorrente(v);
  const geo = v.geom ? (st.dir ? v.geom[v.geom.length-1] : v.geom[0]) : null;
  const nc = civiciVia(v).length; const ap = civiciAperti(v, st.viaId).length;
  const letteraFatta = g && g.data >= p.creato;
  const passOggi = g && (g.passaggi||[]).some(x => x.data===oggi() && x.fascia===fasciaOra());
  let azione;
  if(!letteraFatta) azione = `<button class="btn btn-p btn-big" data-act="lettera" data-id="${st.viaId}" data-guide="1">Lettera messa${nc?' · '+nc:''}</button>`;

     return `<button class="row${k===pos?' cur':''}" data-act="goto-step" data-k="${k}"><span class="n">${k+1}</span><div class="row-main"><div class="row-t">${esc(vv.nome)}</div><div class="row-s">${esc(ss.sub || (civiciVia(vv).length ? civiciVia(vv).length+' civici' : 'civici da inserire'))}</div></div>${pill(ss.l, ss.c)}</button>`; }).join('')}</div></div>

  <div class="danger-zone" id="dz"><button class="btn btn-sm btn-danger" data-act="ask-del" data-what="piano" data-id="${pid}">Elimina giro</button><span class="small">Le vie e i dati restano.</span></div></div>`;
}

function viewVie(){
  const F = [['tutte','Tutte'],['dafare','Da fare'],['attesa','In attesa'],['ripassare','Da ripassare'],['fatte','Fatte']];
  const q = V.q.trim().toLowerCase();
  let items = Object.entries(S.vie).map(([id,v]) => ({id,v,st:statoVia(v,id)}));
  if(q) items = items.filter(x => (x.v.nome+' '+(x.v.zona||'')).toLowerCase().includes(q));
  const f = V.filtroVie;
  if(f==='dafare') items = items.filter(x=>x.st.k==='dafare');
  if(f==='attesa') items = items.filter(x=>x.st.k==='attesa');
  if(f==='ripassare') items = items.filter(x=>['ripassa','secondo'].includes(x.st.k));
  if(f==='fatte') items = items.filter(x=>['fatta','rifare'].includes(x.st.k));
  const zone = {}; items.forEach(x => { const z = (x.v.zona||'').trim() || 'Senza zona'; (zone[z] = zone[z]||[]).push(x); });
  let h = `<div class="top"><h1>Vie</h1><button class="btn btn-sm" data-act="new-via">+ Via a mano</button></div>
  <input class="search" id="q-vie" type="search" placeholder="Cerca via o zona" value="${esc(V.q)}" aria-label="Cerca via o zona">
  <div class="chips" style="margin-top:10px">${F.map(([k,l])=>`<button class="chip" data-act="fvie" data-k="${k}" aria-pressed="${V.filtroVie===k}">${l}</button>`).join('')}</div>`;
  if(!items.length) return h + `<div class="sec"><div class="card empty">${Object.keys(S.vie).length?'Nessuna via con questo filtro.':'Ancora nessuna via. Disegna una zona nella Mappa, oppure aggiungine una a mano.'}</div></div>`;
  Object.keys(zone).sort((a,b)=>a.localeCompare(b,'it')).forEach(z => { const arr = zone[z].sort((a,b)=>a.st.ord-b.st.ord || a.v.nome.localeCompare(b.v.nome,'it'));
    h += `<div class="sec"><div class="sec-h"><div class="zona">${esc(z)}</div><span class="small">${arr.length} vie · ${num(arr.reduce((s,x)=>s+lettereTot(x.v),0))} lettere</span></div><div class="list">${arr.map(x=>rowVia(x.id,x.v)).join('')}</div></div>`; });
  return h;
}

function viewVia(id){
  const v = S.vie[id]; const st = statoVia(v,id); const g = giroCorrente(v);
  const civ = civiciVia(v); const aperti = civiciAperti(v,id);
  const p = g ? (g.passaggi||[]).length : 0;
  const passOggi = g && (g.passaggi||[]).some(x => x.data===oggi() && x.fascia===fasciaOra());
  let azioni = '';
  if(!g) azioni = `<button class="btn btn-p btn-big" data-act="lettera" data-id="${id}">Lettera messa oggi</button>`;
  else {
    azioni = passOggi ? `<div class="hint">Passaggio di oggi (${fasciaOra()}) registrato. Tocca i civici dove qualcuno risponde; quelli che lasci così restano “non c’era”.</div>`
      : `<button class="btn btn-p btn-big" data-act="passaggio" data-id="${id}">Sto ripassando ora · ${fasciaOra()}</button>`;
    if(p>=2 && aperti.length) azioni += `<button class="btn" data-act="biglietti" data-id="${id}">Biglietto lasciato ai ${aperti.length} civici rimasti</button>`;
    if(['fatta','rifare'].includes(st.k)) azioni += `<button class="btn" data-act="lettera" data-id="${id}">Nuovo giro di lettere</button>`;
  }
  const passaggi = g && p ? `<div class="pass">${g.passaggi.map((x,i)=>pill(`${i+1}° · ${fmt(x.data)} · ${x.fascia}`,'accent')).join('')}</div>` : '';
  const hint = (st.k==='secondo' && !passOggi) ? `<div class="hint">Restano ${aperti.length} civici dove non hai trovato nessuno. Ripassa in un’altra fascia oraria (sera o sabato).</div>` : '';
  const shown = V.soloAperti ? aperti : civ;
  const grid = civ.length ? `<div class="grid">${shown.map(c => { const s = statoCivico(v,id,c);
      const cls = s==='aperto' ? '' : s==='contattato' ? 'c-accent' : 'c-'+ESITI[s].c;
      const lab = s==='aperto' ? '' : s==='contattato' ? 'contatto' : ESITI[s].s;
      const cog = (v.segnati||[]).filter(x=>x.civico===c && x.cognome).length;
      return `<button class="civ ${cls}" data-act="civico" data-id="${id}" data-c="${esc(c)}" aria-label="Civico ${esc(c)}${lab?', '+lab:''}">${esc(c)}${lab||cog?`<small>${esc(lab)}${cog>1?' ×'+cog:''}</small>`:''}</button>`; }).join('')}</div>`
    : `<div class="card empty">Nessun civico: imposta l’intervallo (es. 1–60) con “Modifica”, oppure aggiungili a mano.</div>`;
  const cont = contattiDiVia(id);
  const geo = v.geom && v.geom[0];
  return `<button class="back" data-act="back">‹ Indietro</button>
  <div class="top"><div style="min-width:0"><h1>${esc(v.nome)}</h1><div class="date">${esc([v.zona, TIPI[v.tipo], v.dal&&v.al?`civici ${v.dal}–${v.al}${v.lato!=='tutti'?' '+v.lato:''}`:''].filter(Boolean).join(' · '))}</div></div><button class="btn btn-sm" data-act="edit-via" data-id="${id}">Modifica</button></div>
  <div class="card status">
    <div class="status-l">${pill(st.l, st.c)}<span class="meta">${g?`Giro ${v.giri.length} · lettera ${fmt(g.data)} · ${num(g.lettere)} lettere`:'Lettera non ancora messa'}</span></div>
    ${passaggi}${hint}${azioni}
    ${geo?`<a class="btn btn-sm" href="${mapsLink(geo)}" target="_blank" rel="noopener">Portami qui con Maps</a>`:''}
  </div>
  <div class="sec"><div class="sec-h"><h2>Civici</h2><span class="small">${civ.length-aperti.length}/${civ.length} gestiti</span></div>
    <div class="legend">${pill('bianco = non c’era','grey')}${pill('no / stop','red')}${pill('interessato','green')}${pill('contatto','accent')}${pill('biglietto','amber')}</div>
    <div class="btns"><button class="btn btn-sm" data-act="solo-aperti">${V.soloAperti?'Mostra tutti':'Solo da trovare ('+aperti.length+')'}</button><button class="btn btn-sm" data-act="add-civico" data-id="${id}">+ Civico / interno</button></div>
    ${grid}
  </div>
  <div class="sec"><div class="sec-h"><h2>Contatti da questa via</h2><button class="btn btn-sm" data-act="new-cont" data-via="${id}">+ Contatto</button></div>
    ${cont.length?`<div class="list">${cont.map(([cid,k])=>rowCont(cid,k)).join('')}</div>`:'<div class="card empty">Nessuno ancora.</div>'}</div>
  ${v.note?`<div class="sec"><h2>Note</h2><div class="card pad" style="white-space:pre-wrap">${esc(v.note)}</div></div>`:''}`;
}

function viewContatti(){
  const F = [['tutti','Tutti'],['nuovo','Nuovi'],['appuntamento','Appuntamenti'],['cliente','Clienti'],['attesa','Da ricontattare'],['perso','Persi']];
  const q = V.qc.trim().toLowerCase();
  let items = Object.entries(S.contatti);
  if(V.filtroCont!=='tutti') items = items.filter(([,k]) => V.filtroCont==='cliente' ? (k.luce||k.gas) : V.filtroCont==='attesa' ? (k.offerte||[]).length : k.stato===V.filtroCont);
  if(q) items = items.filter(([,k]) => [k.nome,k.telefono,k.indirizzo,k.viaId&&S.vie[k.viaId]?S.vie[k.viaId].nome:''].join(' ').toLowerCase().includes(q));
  items.sort((a,b)=>String(b[1].data||'').localeCompare(String(a[1].data||'')));

  <div class="sec">${items.length?`<div class="list">${items.map(([id,k])=>rowCont(id,k)).join('')}</div>`:`<div class="card empty">${Object.keys(S.contatti).length?'Nessun contatto con questo filtro.':'Qui salvi chi ti scrive, ti chiama o risponde al citofono interessato.'}</div>`}</div>

}

    <div><div class="big">${pct(c.clienti,c.contatti)}</div><div class="small">da contatto a cliente</div></div>
    <div><div class="big">${num(c.lordo)} €</div><div class="small">lordo stimato (${num(imp.gettoneLuce)} € luce, ${num(imp.gettoneGas)} € gas)</div></div>

  <div class="sec"><div class="sec-h"><h2>Prezzi e compensi</h2><button class="btn btn-sm" data-act="edit-imp">Modifica</button></div>

let sheetCtx = null;
function openSheet(html, ctx){ sheetCtx = ctx||{}; $('#sheet-root').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#sheet-root [autofocus]'); if(f) f.focus({preventScroll:true}); }
function closeSheet(){ $('#sheet-root').innerHTML=''; sheetCtx = null; }
const head = t => `<div class="sheet-h"><h3>${esc(t)}</h3><button class="x" data-act="close" aria-label="Chiudi">×</button></div>`;
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const seg = (name, opts, cur) => `<div class="seg" data-seg="${name}">${Object.entries(opts).map(([k,l])=>`<button type="button" data-act="seg" data-name="${name}" data-k="${k}" aria-pressed="${cur===k}">${esc(l)}</button>`).join('')}</div>`;
const segVal = name => { const b = document.querySelector(`[data-seg="${name}"] [aria-pressed="true"]`); return b ? b.dataset.k : null; };

  <div class="f"><span class="lbl">Tipo</span>${seg('tipo', TIPI, v.tipo||'villette')}</div>
  <div class="f3"><div class="f"><label for="v-dal">Dal civico</label><input id="v-dal" inputmode="numeric" value="${esc(v.dal)}"></div><div class="f"><label for="v-al">Al civico</label><input id="v-al" inputmode="numeric" value="${esc(v.al)}"></div><div class="f"><label for="v-lato">Lato</label><select id="v-lato">${['tutti','pari','dispari'].map(l=>`<option ${v.lato===l?'selected':''}>${l}</option>`).join('')}</select></div></div>

  ${id?'':`<div class="f2"><div class="f"><label for="v-lett">Lettere messe</label><input id="v-lett" inputmode="numeric" placeholder="vuoto se non ancora"></div><div class="f"><label for="v-data">Data lettera</label><input id="v-data" type="date" value="${oggi()}"></div></div>`}

  ${id?`<div class="danger-zone" id="dz"><button class="btn btn-sm btn-danger" data-act="ask-del" data-what="via" data-id="${id}">Elimina via</button></div>`:''}`);

function saveVia(id){
  const nome = val('v-nome'); if(!nome){ toast('Scrivi il nome della via.'); return; }
  const v = id ? clone(S.vie[id]) : {giri:[], segnati:[], extra:[], creata:oggi()};
  Object.assign(v, {nome, zona:val('v-zona'), tipo:segVal('tipo')||'villette', dal:val('v-dal'), al:val('v-al'), lato:val('v-lato')||'tutti', note:val('v-note')});
  const newId = id || nid('v');
  if(!id){ const n = parseInt(val('v-lett')); if(n>0) v.giri = [{data: val('v-data')||oggi(), lettere:n, passaggi:[]}]; }
  putVia(newId, v); closeSheet(); if(!id) openVia(newId); toast('Via salvata');
}
function sheetLettera(id, guide){
  const v = S.vie[id]; const n = civiciVia(v).length;
  openSheet(`${head('Lettera messa · '+v.nome)}
  <div class="f2"><div class="f"><label for="l-n">Quante lettere</label><input id="l-n" inputmode="numeric" value="${n||''}" autofocus></div><div class="f"><label for="l-d">Data</label><input id="l-d" type="date" value="${oggi()}"></div></div>
  ${n?'':`<div class="f3"><div class="f"><label for="l-dal">Dal civico</label><input id="l-dal" inputmode="numeric"></div><div class="f"><label for="l-al">Al civico</label><input id="l-al" inputmode="numeric"></div><div class="f"><label for="l-lato">Lato</label><select id="l-lato"><option>tutti</option><option>pari</option><option>dispari</option></select></div></div><div class="small">La mappa non ha i civici di questa via: scrivi il primo e l’ultimo che vedi, così al ripasso hai la griglia.</div>`}
  <div class="small">Nei condomini metti il numero di cassette, non di civici.</div>
  <button class="btn btn-p btn-big" data-act="save-lettera" data-id="${id}" data-guide="${guide?1:''}">Salva${guide?' e vai alla prossima':''}</button>`);
}
function saveLettera(id, guide){
  const n = parseInt(val('l-n')); if(!(n>0)){ toast('Scrivi quante lettere hai messo.'); return; }
  const v = clone(S.vie[id]); v.giri = v.giri||[]; v.giri.push({data:val('l-d')||oggi(), lettere:n, passaggi:[]});
  if(document.getElementById('l-dal') && val('l-dal') && val('l-al')){ v.dal = val('l-dal'); v.al = val('l-al'); v.lato = val('l-lato')||'tutti'; }
  S.vie[id] = v;
  if(guide && V.pianoId && S.piani[V.pianoId]){ const p = S.piani[V.pianoId]; if(p.pos < p.ordine.length-1) p.pos++; }
  save(); closeSheet(); render(); if(guide) focusStep(); toast(`${n} lettere segnate`);
}
function sheetCivico(id, c){
  const v = S.vie[id]; const entries = (v.segnati||[]).filter(s=>s.civico===c);
  const cont = Object.entries(S.contatti).filter(([,k]) => k.viaId===id && String(k.civico||'').trim()===c);

/* ================= zona → giro ================= */
async function cercaVie(){
  const area = V.draw.slice(); V.err = null; V.mode='loading'; V.loadingMsg='Cerco le vie su OpenStreetMap…'; render();
  try{
    const osm = await fetchOSM(area);
    const segs = buildSegments(osm, area);
    if(!segs.length){ V.mode='draw'; V.err = {msg:'Ho scaricato i dati, ma dentro l’area non ci sono vie con nome. Prova a disegnare la zona un po’ più grande.', det:[`elementi ricevuti: ${osm.elements.length}`]}; render(); return; }
    const zoneN = Object.keys(S.piani).length + 1;
    V.found = {area, segs, start: area[0], nome: 'Zona '+zoneN+' · '+fmt(oggi()), tipo:'misto'};
    V.mode='review'; ricalcolaPreview(); render(); fitMap();
  }catch(e){ V.mode='draw'; V.err = {msg:'Non riesco a scaricare le vie: i server di OpenStreetMap non hanno risposto. Riprova tra qualche minuto.', det:(e && e.details) || [String(e && e.message || e)]}; render(); }
}
function ricalcolaPreview(){
  const F = V.found; const idx = F.segs.map((s,i)=>i).filter(i=>F.segs[i].sel);
  const sub = idx.map(i=>F.segs[i]); const r = planRoute(sub, F.start);
  V.preview = {order: r.tour.map(([j,d])=>[idx[j],d]), walk:r.walk, trans:r.trans, tot:r.tot};
  drawMap();
}
function findExistingVia(s){
  const nb = normName(s.base);
  for(const [id,v] of Object.entries(S.vie)){
    if(normName(v.base||v.nome)!==nb) continue;
    if(!v.geom) continue;
    const probe = s.coords[Math.floor(s.coords.length/2)];
    if(distPtLine(probe, v.geom) < 60) return id;
  }
  return null;
}
function salvaGiro(){
  const F = V.found; const pv = V.preview; if(!pv || !pv.order.length) return;
  const nome = val('z-nome') || F.nome; const tipo = segVal('ztipo') || 'misto';
  const ordine = [];
  pv.order.forEach(([i,d]) => { const s = F.segs[i]; let id = findExistingVia(s);
    if(id){ const v = S.vie[id]; (s.civici||[]).forEach(c => { if(!(v.extra||[]).includes(c)) (v.extra = v.extra||[]).push(c); }); if(!v.zona) v.zona = nome; }
    else { id = nid('v'); S.vie[id] = {nome:s.nome, base:s.base, zona:nome, tipo, dal:'', al:'', lato:'tutti', extra:s.civici.slice(), giri:[], segnati:[], note:'', geom:s.coords, creata:oggi(), osm:true}; }
    ordine.push({viaId:id, dir:d}); });
  const pid = nid('p');
  S.piani[pid] = {nome, creato:oggi(), area:F.area, ordine, pos:0, dist:Math.round(pv.tot)};
  save(); V.found=null; V.preview=null; V.draw=[]; V.mode='idle'; V.pianoId=pid; render(); focusStep();
  toast('Giro salvato: parti dalla via 1');
}
function replan(pid){
  const p = S.piani[pid]; const done = p.ordine.slice(0, p.pos); const rest = p.ordine.slice(p.pos).filter(o=>S.vie[o.viaId] && S.vie[o.viaId].geom);
  const segs = rest.map(o => ({coords:S.vie[o.viaId].geom, len:lineLen(S.vie[o.viaId].geom)}));
  let start = mePos;
  if(!start && done.length){ const last = done[done.length-1]; const v = S.vie[last.viaId]; if(v && v.geom) start = last.dir ? v.geom[0] : v.geom[v.geom.length-1]; }
  const r = planRoute(segs, start);
  p.ordine = done.concat(r.tour.map(([j,d]) => ({viaId:rest[j].viaId, dir:d})));
  putPiano(pid, p); focusStep(); toast(mePos ? 'Ricalcolato da dove sei' : 'Ricalcolato dalla via attuale');
}

/* ================= backup ================= */
function exportData(){
  const data = JSON.stringify({app:'giro-lettere', versione:1, esportato:new Date().toISOString(), vie:S.vie, contatti:S.contatti, impostazioni:S.imp, piani:S.piani}, null, 1);
  const blob = new Blob([data], {type:'application/json'}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `giro-lettere-${oggi()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  S.meta.ultimoBackup = oggi(); save(); render(); toast('Backup scaricato: salvalo su Drive o mandalo a te stesso');
}
function importData(file){
  const r = new FileReader();
  r.onload = () => { try{ const o = JSON.parse(r.result);
      if(!o || (!o.vie && !o.contatti)) throw new Error('formato');
      Object.assign(S.vie, o.vie||{}); Object.assign(S.contatti, o.contatti||{}); Object.assign(S.piani, o.piani||{});
      if(o.impostazioni||o.imp) S.imp = {...DEF_IMP, ...(o.impostazioni||o.imp)};
      save(); render(); toast(`Ripristinati ${Object.keys(o.vie||{}).length} vie e ${Object.keys(o.contatti||{}).length} contatti`);
    }catch(e){ toast('Questo file non è un backup di Giro Lettere.'); } };
  r.readAsText(file);
}

    case 'export': exportData(); break;
    case 'import': $('#import-file').click(); break;
    case 'new-zone': V.tab='mappa'; V.viaId=null; V.pianoId=null; V.mode='draw'; V.draw=[]; V.found=null; V.preview=null; location.hash='mappa'; render(); window.scrollTo(0,0); setTimeout(()=>{ if(map){ map.invalidateSize(); if(mePos) map.setView(mePos,16); } }, 80); break;
    case 'draw-undo': V.draw.pop(); drawMap(); render(); break;
    case 'draw-cancel': V.err=null; V.mode='idle'; V.draw=[]; V.found=null; V.preview=null; render(); break;
    case 'draw-done': cercaVie(); break;
    case 'save-plan': salvaGiro(); break;
    case 'open-piano': V.tab='mappa'; V.viaId=null; V.mode='idle'; V.pianoId=id; location.hash='mappa'; render(); window.scrollTo(0,0); setTimeout(focusStep, 80); break;
    case 'close-piano': V.pianoId=null; render(); fitMap(); break;
    case 'step': { const p = S.piani[V.pianoId]; p.pos = Math.max(0, Math.min(p.ordine.length-1, (p.pos||0)+Number(t.dataset.d))); putPiano(V.pianoId, p); focusStep(); window.scrollTo(0,0); break; }
    case 'goto-step': { const p = S.piani[V.pianoId]; p.pos = Number(t.dataset.k); putPiano(V.pianoId, p); focusStep(); window.scrollTo(0,0); break; }
    case 'replan': replan(id); break;
    case 'gps': toggleGPS(); break;
    case 'fit': if(V.pianoId && V.mode==='idle') focusStep(); else fitMap(); break;
  }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-act="seg-sel"]') && V.found){ V.found.nome = val('z-nome') || V.found.nome; V.found.segs[Number(e.target.dataset.i)].sel = e.target.checked; ricalcolaPreview(); render(); }
  if(e.target.id==='import-file' && e.target.files[0]){ importData(e.target.files[0]); e.target.value=''; }
});
document.addEventListener('input', e => {
  if(e.target.id==='z-nome' && V.found){ V.found.nome = e.target.value; return; }
  const k = e.target.id==='q-vie' ? 'q' : e.target.id==='q-cont' ? 'qc' : null; if(!k) return;
  V[k] = e.target.value; const pos = e.target.selectionStart; const idf = e.target.id; render(); const n = document.getElementById(idf); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetCtx!==null) closeSheet(); });

function fromHash(){
  const h = (location.hash||'').slice(1);
  if(h.startsWith('via-')){ V.viaId = h.slice(4); }
  else if(['oggi','mappa','vie','contatti','stats'].includes(h)){ V.tab = h; V.viaId = null; }
}
window.addEventListener('hashchange', () => { fromHash(); render(); });
load(); fromHash(); render();
if(V.tab==='mappa') setTimeout(fitMap, 100);
</script>
